<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;display=swap');
      
      .logo-text {
        font-family: 'Fredoka', sans-serif;
        font-size: 175px; 
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
      }
    </style>
    
    <mask id="bite-effect">
      <rect width="512" height="512" fill="white" />
      <circle cx="490" cy="22" r="75" fill="black" />
      <circle cx="445" cy="-15" r="45" fill="black" />
      <circle cx="525" cy="75" r="45" fill="black" />
    </mask>
  </defs>

  <rect x="15" y="15" width="482" height="482" rx="110" fill="#00c2e8" mask="url(#bite-effect)" />

  <text x="256" y="265" dominant-baseline="middle" class="logo-text">bites</text>
</svg>
