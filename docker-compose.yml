services:
  # C++ Backend Server
  cpp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    networks:
      - app-network
  
  # Node.js API Server
  app-server:
    build:
      context: .
      dockerfile: Dockerfile.gateway 
    ports:
      - "8080:8080"
    environment:
      - CPP_SERVER_HOST=cpp-server
      - CPP_SERVER_PORT=8000
      - MONGODB_URI=mongodb://mongo:27017/woltDB
    depends_on:
      - cpp-server
      - mongo  
    networks:
      - app-network

  # React Frontend Server 
  frontend:
    build:
      context: ./wolt-frontend  
    ports:
      - "3000:3000"            
    volumes:
      - ./wolt-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - app-network

  # MongoDB Service
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge