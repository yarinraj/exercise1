services:
  # C++ Server Service
  cpp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8000:8000"
    networks:
      - app-network

  # cppGateway.js API Service
  cpp-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - CPP_SERVER_HOST=cpp-server
      - CPP_SERVER_PORT=8000
    depends_on:
      - cpp-server
      - mongo  
    networks:
      - app-network

  # MongoDB Service
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge